name: CodeQL digest (one-shot, self-consuming)

on:
  push:
    branches: ['ci/codeql-report']

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: github/codeql-action/init@e60ea984bd3baa95954f2856bcf24f9eaba46637 # v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/analyze@e60ea984bd3baa95954f2856bcf24f9eaba46637 # v3
        with:
          category: "/language:javascript-typescript"
          upload: false
          output: codeql-out

      - name: Build digest from SARIF
        run: |
          python3 - << 'EOF'
          import json, glob, collections, os

          path = glob.glob('codeql-out/*.sarif')[0]
          sarif = json.load(open(path))
          run = sarif['runs'][0]

          rules = {}
          for r in run['tool']['driver'].get('rules', []):
              props = r.get('properties', {})
              rules[r['id']] = {
                  'name': r.get('name', r['id']),
                  'sev': props.get('security-severity'),
                  'level': props.get('problem.severity', 'unknown'),
                  'tags': props.get('tags', []),
                  'desc': (r.get('shortDescription') or {}).get('text', ''),
              }

          by_rule = collections.defaultdict(list)
          for res in run.get('results', []):
              rid = res['ruleId']
              loc = res['locations'][0]['physicalLocation']
              by_rule[rid].append({
                  'file': loc['artifactLocation']['uri'],
                  'line': loc['region'].get('startLine'),
                  'msg': res['message']['text'][:200],
              })

          def sort_key(item):
              rid, hits = item
              meta = rules.get(rid, {})
              sec = float(meta.get('sev') or 0)
              order = {'error': 0, 'warning': 1, 'recommendation': 2}
              return (-sec, order.get(meta.get('level'), 3), -len(hits))

          out = ['# CodeQL digest', '',
                 f"total results: {len(run.get('results', []))}",
                 f"rules with hits: {len(by_rule)}", '']

          for rid, hits in sorted(by_rule.items(), key=sort_key):
              meta = rules.get(rid, {})
              sec = meta.get('sev')
              secmark = f" security-severity={sec}" if sec else ""
              is_sec = 'security' in ' '.join(meta.get('tags', []))
              out.append(f"## {rid}  [{meta.get('level')}{secmark}]"
                         f"{' SECURITY' if is_sec else ''}  x{len(hits)}")
              out.append(f"{meta.get('desc','')}")
              files = collections.Counter(h['file'] for h in hits)
              out.append(f"files: {dict(files)}")
              for h in hits[:6]:
                  out.append(f"  - {h['file']}:{h['line']}  {h['msg']}")
              if len(hits) > 6:
                  out.append(f"  ... and {len(hits)-6} more")
              out.append('')

          open('CODEQL-DIGEST.md', 'w').write('\n'.join(out))
          print('\n'.join(out[:60]))
          EOF

      - name: Commit digest and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CODEQL-DIGEST.md
          git rm -q .github/workflows/codeql-report.yml
          git commit -m "Add CodeQL digest; retire digest workflow"
          git push
