name: Card tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install toolchain (locked, no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Card behaviour suite (must be 0 failures)
        run: node test/harness.js

      - name: Zone-grouping suite (must be 0 failures)
        run: node test/zones.test.js

      - name: Editor-preview origin suite (must be 0 failures)
        run: node test/editor-preview.test.js

      - name: Negative control — suites must FAIL on unhardened upstream
        run: |
          # A suite that cannot detect the absence of our changes is decoration.
          # Fetch the audited upstream bundle and confirm the suites reject it.
          curl -sSfL -o /tmp/upstream.js \
            https://raw.githubusercontent.com/yyqclhy/RosCard/a1fe0684ae217febad5012faefeefc62be0c1843/dist/RosCard.js
          # sha-verify: a missing or altered input must never look like a pass.
          echo "0f92e5ba7731f93c2c2ea102be9c13207249b95acf9a8fe0b4c07010141bea50  /tmp/upstream.js" | sha256sum -c -

          # NOTE: this step runs under `bash -eo pipefail`. A bare failing
          # command aborts before `rc=$?` executes, so every expected-failure
          # invocation must capture its status with `|| rc=$?`.
          rc=0
          for suite in harness zones.test editor-preview.test; do
            src=0
            ROSCARD_BUNDLE=/tmp/upstream.js node "test/${suite}.js" > "/tmp/up-${suite}.log" 2>&1 || src=$?
            if [ "$src" -eq 0 ]; then
              echo "::error::${suite} PASSED against unhardened upstream — it no longer detects our changes."
              cat "/tmp/up-${suite}.log"
              rc=1
            elif [ "$src" -ne 1 ]; then
              # exit 2 means the bundle was missing: a broken control, not a pass.
              echo "::error::${suite} errored (exit $src) instead of reporting failures."
              cat "/tmp/up-${suite}.log"
              rc=1
            else
              echo "--- ${suite} correctly rejects upstream:"
              grep -E 'FAIL|passed,' "/tmp/up-${suite}.log" || true
            fi
          done
          exit "$rc"
