name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: github/codeql-action/init@e60ea984bd3baa95954f2856bcf24f9eaba46637 # v3
        with:
          languages: javascript-typescript
          # security-extended, not security-and-quality: the quality queries
          # only flag artifacts of the minified-then-beautified vendor bundle
          # (hoisting, trivial conditionals, ASI) and would bury real findings.
          queries: security-extended

      - uses: github/codeql-action/analyze@e60ea984bd3baa95954f2856bcf24f9eaba46637 # v3
        with:
          category: "/language:javascript-typescript"
