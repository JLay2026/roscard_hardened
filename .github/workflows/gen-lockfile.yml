name: Generate lockfile (one-shot, self-consuming)

on:
  push:
    branches: ['ci/**']

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Generate lockfile (metadata only, no scripts run)
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Verify every package carries an integrity hash
        run: |
          python3 - << 'EOF'
          import json, sys
          pk = json.load(open('package-lock.json'))['packages']
          missing = [k for k, v in pk.items() if k and not v.get('integrity')]
          if missing:
              print('packages without integrity hash:', missing)
              sys.exit(1)
          print(f'{len(pk) - 1} packages, all integrity-pinned')
          EOF

      - name: Commit lockfile and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm -q .github/workflows/gen-lockfile.yml
          git commit -m "Add integrity-pinned package-lock.json; retire lockfile generator"
          git push
