name: Semgrep

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Semgrep
        run: pipx install semgrep==1.172.0

      - name: Registry packs (blocking at ERROR severity)
        run: |
          semgrep scan --config p/javascript --config p/secrets \
            --severity ERROR --error --metrics=off \
            src/ dist/ .github/ package.json

      - name: Custom rules (blocking on any ERROR finding)
        run: |
          semgrep scan --config .semgrep/rules.yml \
            --metrics=off --json -o /tmp/custom.json src/ dist/
          python3 - << 'EOF'
          import json, sys
          BASELINE = 25  # remaining upstream innerHTML-concat sinks (static translation data only); ratchet DOWN only
          d = json.load(open('/tmp/custom.json'))
          errors = [r for r in d['results'] if r['extra']['severity'] == 'ERROR']
          sinks = [r for r in d['results']
                   if r['check_id'].endswith('dynamic-innerhtml-concat')
                   and r['path'].startswith('src/')]
          if errors:
              for r in errors:
                  print(f"ERROR {r['check_id']} at {r['path']}:{r['start']['line']}")
              sys.exit(1)
          print(f"innerHTML-concat sinks in src/: {len(sinks)} (baseline {BASELINE})")
          if len(sinks) > BASELINE:
              print("New DOM-XSS sinks introduced — failing. "
                    "Fix them or (only with review) raise the baseline.")
              sys.exit(1)
          EOF
