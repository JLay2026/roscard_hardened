name: CodeQL flow dump (one-shot, self-consuming)

on:
  push:
    branches: ['ci/codeql-report']

permissions:
  contents: write

jobs:
  flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: github/codeql-action/init@e60ea984bd3baa95954f2856bcf24f9eaba46637 # v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/analyze@e60ea984bd3baa95954f2856bcf24f9eaba46637 # v3
        with:
          category: "/language:javascript-typescript"
          upload: false
          output: codeql-out

      - name: Dump dataflow for security results
        run: |
          python3 - << 'EOF'
          import json, glob

          sarif = json.load(open(glob.glob('codeql-out/*.sarif')[0]))
          run = sarif['runs'][0]
          src = open('src/RosCard.js').read().split('\n')

          def snippet(loc):
              pl = loc.get('physicalLocation', {})
              uri = pl.get('artifactLocation', {}).get('uri', '?')
              line = pl.get('region', {}).get('startLine')
              col = pl.get('region', {}).get('startColumn')
              text = src[line - 1].strip()[:220] if (uri.endswith('RosCard.js') and line) else ''
              return f"{uri}:{line}:{col}  {text}"

          out = ['# CodeQL dataflow — security results', '']
          n = 0
          for res in run.get('results', []):
              rid = res['ruleId']
              if 'xss' not in rid and 'injection' not in rid and 'unsafe' not in rid:
                  continue
              n += 1
              out.append(f"## [{n}] {rid}")
              out.append(f"message: {res['message']['text']}")
              out.append(f"sink:   {snippet(res['locations'][0])}")
              for rl in res.get('relatedLocations', []):
                  msg = rl.get('message', {}).get('text', '')
                  out.append(f"related ({msg}): {snippet(rl)}")
              for cf in res.get('codeFlows', []):
                  for tf in cf.get('threadFlows', []):
                      out.append("  flow:")
                      for st in tf.get('locations', []):
                          l = st.get('location', {})
                          m = l.get('message', {}).get('text', '')
                          out.append(f"    - {snippet(l)}   [{m}]")
              out.append('')

          if n == 0:
              out.append('no security-tagged results')
          open('CODEQL-FLOW.md', 'w').write('\n'.join(out))
          print('\n'.join(out))
          EOF

      - name: Commit and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CODEQL-FLOW.md
          git rm -q .github/workflows/codeql-flow.yml
          git commit -m "Add CodeQL dataflow dump; retire flow workflow"
          git push
