name: Apply hardening patch

# Manual only. Previously auto-ran on every push to harden/** while holding
# contents:write and pushing commits — standing privilege with no ongoing need.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to apply hardening/*.patch on (must start with harden/)'
        required: true

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Guard branch name
        run: |
          case "${BRANCH}" in
            harden/*) ;;
            *) echo "::error::refusing to run on '${BRANCH}' — must start with harden/"; exit 1 ;;
          esac
        env:
          BRANCH: ${{ inputs.branch }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Check patch state
        id: state
        run: |
          shopt -s nullglob
          patches=(hardening/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "no patches present — nothing to do"
            echo "apply=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git apply --check "${patches[@]}" 2>/dev/null; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          elif git apply --reverse --check "${patches[@]}" 2>/dev/null; then
            echo "patches already applied — nothing to do"
            echo "apply=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::patches neither apply cleanly nor are applied"
            exit 1
          fi

      - name: Apply patch and rebuild dist
        if: steps.state.outputs.apply == 'true'
        run: |
          git apply hardening/*.patch
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          node --check dist/RosCard.js
          count=$(grep -oE '\.define\("[a-z0-9-]+"' dist/RosCard.js | wc -l)
          if [ "$count" -ne 22 ]; then
            echo "::error::expected 22 custom elements, got $count"
            exit 1
          fi
          sha256sum dist/RosCard.js > checksums.txt

      - name: Commit result
        if: steps.state.outputs.apply == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/RosCard.js dist/RosCard.js checksums.txt
          git rm -q hardening/*.patch
          git commit -m "Apply hardening patch; rebuild dist (esbuild); update checksum pin"
          git push
