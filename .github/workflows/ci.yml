name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # A hardening patch describes a change to src/ that the apply-hardening
      # workflow performs. If a patch file is still present, the change it
      # describes has NOT been made — merging now ships the description instead
      # of the fix. Every other gate passes in that state, because dist still
      # matches a rebuild of the (unmodified) src. This has bitten twice.
      - name: Unapplied-patch guard
        run: |
          shopt -s nullglob
          patches=(hardening/*.patch)
          if [ ${#patches[@]} -gt 0 ]; then
            echo "::error::${#patches[@]} unapplied hardening patch(es) present: ${patches[*]}"
            echo ""
            echo "These describe changes to src/ that have not been made yet."
            echo "Merging now would ship the patch file, not the fix — and every"
            echo "other gate would still pass, because dist/ matches a rebuild of"
            echo "the unmodified src/."
            echo ""
            echo "Run: Actions -> Apply hardening patch -> branch ${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
            echo "Wait for the 'Apply hardening patch' commit, then re-run this check."
            exit 1
          fi
          echo "no unapplied hardening patches"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Dist integrity gate (accidental drift)
        run: |
          sha256sum -c checksums.txt
          echo "dist/ matches pinned checksums"

      - name: Install toolchain (locked, no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Reproducible-build gate (src is the source of truth)
        run: |
          npx esbuild src/RosCard.js --bundle --minify \
            --outfile=/tmp/rebuild.js --format=iife --charset=utf8
          if ! cmp -s /tmp/rebuild.js dist/RosCard.js; then
            echo "::error::dist/RosCard.js does NOT match a rebuild of src/RosCard.js."
            echo "The shipped bundle must be exactly what src builds to."
            echo "Run 'npm ci --ignore-scripts && npm run build' and commit the result."
            sha256sum /tmp/rebuild.js dist/RosCard.js
            exit 1
          fi
          echo "dist/ is byte-identical to a rebuild of src/"

      - name: Verify bundle shape
        run: |
          node --check dist/RosCard.js
          count=$(grep -oE '\.define\("[a-z0-9-]+"' dist/RosCard.js | wc -l)
          if [ "$count" -ne 22 ]; then
            echo "::error::expected 22 custom elements, got $count"
            exit 1
          fi
          echo "syntax valid, 22 custom elements"

      # Assets are referenced by absolute path baked into the bundle. HACS serves
      # them from a directory named after THIS repo, so a rename silently 404s
      # every icon — and no JS test catches it, because nothing fetches images.
      - name: Asset-reference integrity gate
        run: |
          python3 - << 'EOF'
          import os, re, sys
          repo = os.environ['GITHUB_REPOSITORY'].split('/')[1]
          src = open('src/RosCard.js', encoding='utf-8').read()
          fail = False

          folders = set(re.findall(r'/local/community/([A-Za-z0-9._-]+)/', src))
          if folders != {repo}:
              print(f'::error::asset folder(s) {sorted(folders)} != repo name {repo!r}. '
                    f'HACS serves assets from /local/community/{repo}/ — every icon would 404.')
              fail = True

          refs = sorted(set(re.findall(r'icon_img/[A-Za-z0-9._-]+', src)))
          if not refs:
              print('::error::no icon_img references found — did the asset paths move?')
              fail = True
          for r in refs:
              if os.path.isfile(os.path.join('dist', r)):
                  print(f'  ok      {r}')
              else:
                  print(f'::error::referenced asset missing from dist/: {r}')
                  fail = True

          sys.exit(1 if fail else 0)
          EOF

      - name: Dependency audit (fail on high+)
        run: npm audit --audit-level=high

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: reviewdog/action-actionlint@50842263c20a7c46bd0065b9e624d3c569db061e # v1.73.0
        with:
          reporter: github-check
          fail_level: error
